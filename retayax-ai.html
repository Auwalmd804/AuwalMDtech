<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetayaX AI Assistant</title>
    <!-- FontAwesome domin hotunan maɓallai (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #00b074;
            --bg-color: #0d1b2a;
            --chat-bg: #1b263b;
            --text-color: #ffffff;
            --bot-bubble: #415a77;
            --user-bubble: #00b074;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Tsarin Shugaban Shafin */
        .chat-header {
            background-color: var(--chat-bg);
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .chat-header i {
            color: var(--primary-color);
        }

        /* Wurin Hira */
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message-wrapper.user {
            align-self: flex-end;
        }

        .message-wrapper.bot {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 1rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user .message-bubble {
            background-color: var(--user-bubble);
            border-bottom-right-radius: 2px;
        }

        .bot .message-bubble {
            background-color: var(--bot-bubble);
            border-bottom-left-radius: 2px;
        }

        /* Tsarin Maɓallan Aiki (Toolbar) */
        .action-toolbar {
            display: flex;
            gap: 12px;
            margin-top: 5px;
            padding-left: 5px;
            font-size: 0.85rem;
            color: #ccc;
        }

        .action-icon {
            cursor: pointer;
            transition: color 0.2s;
        }

        .action-icon:hover {
            color: var(--primary-color);
        }

        .action-icon.liked {
            color: #4caf50;
        }

        .action-icon.disliked {
            color: #f44336;
        }

        /* Maɓallan Shawwari (Follow-up Buttons) */
        .suggestions-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .suggestion-btn {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .suggestion-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        /* Tsarin Rubutu na ɗaki-ɗaki (Typing Cursor) */
        .typing::after {
            content: '▊';
            animation: blink 0.6s infinite;
            color: var(--primary-color);
            margin-left: 2px;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Wurin Tura Saƙo */
        .input-container {
            padding: 15px;
            background-color: var(--chat-bg);
            display: flex;
            gap: 10px;
            border-top: 1px solid #2b3a4a;
        }

        .input-container input {
            flex: 1;
            padding: 12px;
            border-radius: 25px;
            border: 1px solid #415a77;
            background-color: var(--bg-color);
            color: white;
            outline: none;
            font-size: 1rem;
        }

        .input-container input:focus {
            border-color: var(--primary-color);
        }

        .send-btn {
            background-color: var(--primary-color);
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="chat-header">
        <i class="fa-solid fa-robot"></i> RetayaX Professional AI
    </div>

    <div class="chat-container" id="chatContainer">
        <!-- Sakon Barka da Zuwa na Fari -->
        <div class="message-wrapper bot">
            <div class="message-bubble">Barka da zuwa RetayaX AI! 👋 Ina jinka, wane taimako kake buƙata yanzu ko wace shawara kake nema?</div>
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Rubuta tambayarka anan..." autocomplete="off">
        <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // 1. Taskar Gyara Kuskuren Rubutu (Fuzzy/Typo Correction Dictionary)
        const typoDictionary = {
            "subahanallahi": "subhanallah",
            "kudi": "kuɗi",
            "data": "data",
            "retyax": "retayax",
            "retayax": "RetayaX",
            "profeahonal": "professional",
            "mistak": "mistake",
            "amsarshi": "amsarsa",
            "tanyaba": "tambaya"
        };

        function cleanAndCorrectText(text) {
            let words = text.toLowerCase().split(" ");
            let correctedWords = words.map(word => typoDictionary[word] || word);
            return correctedWords.join(" ");
        }

        // 2. Taskar Bayanai da Emojis na Yanayi (Database & Sentiment)
        const aiDatabase = {
            "murna": {
                text: "Wannan babban labari ne mai daɗi kwarai da gaske! 🎉 Muna taya ka farin ciki da wannan babban nasara. Koda yaushe RetayaX tana tare da kai don samar maka da farin ciki 😁",
                follows: ["Yaya zan ƙara faɗaɗa wannan nasarar?", "Wane sabon tsari kuke da shi na murna?"]
            },
            "kudi": {
                text: "Maganar kuɗi tana da muhimmanci sosai 💰 A dandalin RetayaX, muna samar maka da sauƙi wurin siyan Data, Airtime, da biyan kuɗin wutar lantarki cikin sauri da aminci ba tare da ɓata lokaci ba! ⚡",
                follows: ["Yaya zan saka kuɗi a walet tawa?", "Nuna min farashin Data mafi sauƙi"]
            },
            "matsala": {
                text: "Haba dai! Kada ka damu, mun tsara wannan tsarin ne musamman domin magance kowace irin matsala cikin sauri 🥺 Gaskiya muna ba ka haƙuri game da abin da ya faru. Bari mu duba ma'aikatanmu za su magance maka yanzu 🙏",
                follows: ["Tuntuɓi Ma'aikata kai tsaye", "Yaya zan dawo da tsohon kuɗina?"]
            },
            "mamaki": {
                text: "Iye?! Wannan abin mamaki ne da ban al'ajabi kwarai da gaske! 😱 Ban taɓa tsammanin hakan zai kasance haka cikin sauri ba 🤯 Bari mu bincika ƙarin bayani a kansa.",
                follows: ["Me ya sa hakan ta faru?", "Ba ni ƙarin shawarwari akan wannan"]
            },
            "default": {
                text: "Na fahimci tambayarka sarai kuma mun tsara wannan tsarin ne domin ba ka mafi kyawun shawara da taimako a kowane lokaci 🧠 Domin samun cikakken tsari, RetayaX tana buɗe kofa a gare ka sa'o'i 24.",
                follows: ["Nuna min ayyukan RetayaX", "Ina son ƙarin bayani akan tsarin AI"]
            }
        };

        // 3. Tsarin Tura Saƙo
        function handleSend() {
            const rawText = userInput.value.trim();
            if (!rawText) return;

            // Nuna saƙon Customer
            appendMessage(rawText, 'user');
            userInput.value = '';

            // Gyara kuskuren rubutu cikin sauri
            const correctedText = cleanAndCorrectText(rawText);

            // Gano amsar da ta dace
            let matchedKey = "default";
            for (let key in aiDatabase) {
                if (correctedText.includes(key)) {
                    matchedKey = key;
                    break;
                }
            }

            const responseData = aiDatabase[matchedKey];
            
            // Tura amsar zuwa tsarin Streaming (Typing Effect)
            setTimeout(() => {
                streamBotResponse(responseData.text, responseData.follows);
            }, 500);
        }

        // 4. Tsarin Nuna Rubutu Ɗaki-ɗaki (Professional Streaming Effect)
        function streamBotResponse(fullText, follows) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper bot';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble typing';
            wrapper.appendChild(bubble);

            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            let words = fullText.split(' ');
            let index = 0;
            bubble.innerText = '';

            // Gudu na musamman (Professional Typing Speed)
            let interval = setInterval(() => {
                if (index < words.length) {
                    bubble.innerText += (index === 0 ? '' : ' ') + words[index];
                    index++;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                } else {
                    clearInterval(interval);
                    bubble.classList.remove('typing'); // Cire alamar ƙyiftawa
                    
                    // Bayan kammala rubutun, nuna Maɓallan Aiki da Tambayoyin Jan Hankali
                    addToolbarsAndSuggestions(wrapper, fullText, follows);
                }
            }, 120); // Gudun fitar kalma bayan kalma
        }

        // 5. Ƙara Maɓallan Like, Dislike, Copy, Share da Shawwari
        function addToolbarsAndSuggestions(wrapper, textToCopy, follows) {
            // Kirkirar Toolbar
            const toolbar = document.createElement('div');
            toolbar.className = 'action-toolbar';
            toolbar.innerHTML = `
                <i class="fa-regular fa-thumbs-up action-icon" title="Like" onclick="handleLike(this)"></i>
                <i class="fa-regular fa-thumbs-down action-icon" title="Dislike" onclick="handleDislike(this)"></i>
                <i class="fa-regular fa-copy action-icon" title="Copy" onclick="handleCopy('${textToCopy.replace(/'/g, "\\'")}')"></i>
                <i class="fa-solid fa-share-nodes action-icon" title="Share" onclick="handleShare('${textToCopy.replace(/'/g, "\\'")}')"></i>
            `;
            wrapper.appendChild(toolbar);

            // Kirkirar Maɓallan Tambayoyin Jan Hankali (Dynamic Suggestion Buttons)
            const suggestionsContainer = document.createElement('div');
            suggestionsContainer.className = 'suggestions-container';
            
            follows.forEach(question => {
                const btn = document.createElement('button');
                btn.className = 'suggestion-btn';
                btn.innerText = question;
                btn.onclick = () => {
                    userInput.value = question;
                    handleSend();
                };
                suggestionsContainer.appendChild(btn);
            });

            wrapper.appendChild(suggestionsContainer);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Ayyukan Maɓallan (Toolbar Functions)
        function handleLike(element) {
            element.classList.toggle('fa-regular');
            element.classList.toggle('fa-solid');
            element.classList.toggle('liked');
        }

        function handleDislike(element) {
            element.classList.toggle('fa-regular');
            element.classList.toggle('fa-solid');
            element.classList.toggle('disliked');
        }

        function handleCopy(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('An kwafto rubutun cikin nasara! 📋');
            });
        }

        function handleShare(text) {
            if (navigator.share) {
                navigator.share({
                    title: 'RetayaX AI Response',
                    text: text
                }).catch(console.error);
            } else {
                alert('An yi share na saƙon: ' + text);
            }
        }

        function appendMessage(text, sender) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender}`;
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.innerText = text;
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Latsa Enter don tura saƙo
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
        sendBtn.addEventListener('click', handleSend);
    </script>
</body>
</html>
